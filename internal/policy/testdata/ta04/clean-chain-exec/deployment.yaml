# TA04 clean-chain-exec fixture — allow_chain_exec is left at its default
# (false/absent), matching goclaw PR#1033's documented safe default: shell
# chains that reference a credentialed binary are rejected with an actionable
# error instead of leaking credential env vars into the full chain.
tools:
  exec:
    - name: shell-exec
      env_policy:
        deny_direct_env_dump: true
        deny_indirect_env_read: true
        allow_chain_exec: false
