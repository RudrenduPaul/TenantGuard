name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - name: Vet
        run: go vet ./...
      - name: Build
        run: go build ./...
      - name: Test with coverage
        run: go test ./... -cover -coverprofile=coverage.out
      - name: Coverage summary
        run: go tool cover -func=coverage.out | tail -1
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - name: govulncheck
        uses: golang/govulncheck-action@v1
        with:
          go-version-input: "1.26"

  self-scan:
    # Dogfooding: run the CLI's own --demo mode as a smoke test on every push,
    # confirming the binary builds and the bundled fixture still scans cleanly
    # through the actual compiled artifact, not just `go test`.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - name: Build
        run: go build -o tenantguard ./cmd/tenantguard
      - name: Demo scan (expected to find 5 known violations, exit 1)
        run: |
          set +e
          ./tenantguard scan --demo
          code=$?
          set -e
          if [ "$code" -ne 1 ]; then
            echo "expected exit code 1 (findings present) from the demo scan, got $code"
            exit 1
          fi
