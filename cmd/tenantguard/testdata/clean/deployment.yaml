# A fully compliant deployment, passing all TA0N checks (including TA13) —
# used by TestCleanTargetExitsZero.
sandbox:
  mounts:
    - path: /shared/${TENANT_ID}/workspace
bridge:
  hmac_enabled: true
  context_headers_signed: true
tools:
  mcp:
    - url: https://api.example.com/tools
      validates_private: false
  exec:
    - name: shell-exec
      env_policy:
        deny_direct_env_dump: true
        deny_indirect_env_read: true
      approvals:
        - basename: python3
          path_scoped: true
schedules:
  cron:
    - tenant: tenant-a
      target_agent: research-agent-a
agents:
  - name: research-agent-a
    tenant: tenant-a
