# Bundled demo deployment for `tenantguard scan --demo` — a synthetic config
# combining one violation of each TA01-TA05 and TA07 rule, so a first-time
# user gets a real, HIPAA-cited finding within seconds, with zero setup.
# Reused directly from the same fixture pattern built for TA0N unit tests;
# this is not new content authored just for the demo.
sandbox:
  mounts:
    - path: /shared/workspace # FAIL (TA01): no ${TENANT_ID} scoping
      user: root # FAIL (TA07): sandbox runs as root by default
      env_mode: inherit_host # FAIL (TA07): full host environment passthrough
      tmpfs_flags: [] # FAIL (TA07): tmpfs missing noexec/nosuid/nodev
      cap_add: [SETUID] # FAIL (TA07): dangerous capability added

tools:
  mcp:
    - url: http://127.0.0.1:9000/tools # FAIL (TA02): private target, no SSRF validation declared
      validates_private: false
  exec:
    - name: shell-exec
      env_policy:
        deny_direct_env_dump: true
        deny_indirect_env_read: false # FAIL (TA04): direct denied, indirect not covered
      approvals:
        - basename: python3
          path_scoped: false # FAIL (TA05): allow-always keyed on basename only

schedules:
  cron:
    - tenant: tenant-a
      target_agent: research-agent-tenant-b # FAIL (TA03): cron binding crosses tenant boundary

agents:
  - name: research-agent-tenant-b
    tenant: tenant-b
