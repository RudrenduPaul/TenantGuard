# Bundled demo deployment for `tenantguard scan --demo` — a synthetic config
# combining one violation of each TA01-TA05 rule, plus TA06 (cron creator
# identity), TA07 (sandbox container privilege), TA09 (sandbox.on_unavailable
# is never declared below), and TA10 (the agent below declares no per-agent
# overrides), so a first-time user gets a real, HIPAA-cited finding within
# seconds, with zero setup. Reused directly from the same fixture pattern
# built for TA0N unit tests; this is not new content authored just for the
# demo.
sandbox:
  mounts:
    - path: /shared/workspace # FAIL (TA01): no ${TENANT_ID} scoping
      user: root # FAIL (TA07): sandbox runs as root by default
      env_mode: inherit_host # FAIL (TA07): full host environment passthrough
      tmpfs_flags: [] # FAIL (TA07): tmpfs missing noexec/nosuid/nodev
      cap_add: [SETUID] # FAIL (TA07): dangerous capability added
  # FAIL (TA09): on_unavailable is never declared, so there is no configured
  # fail-closed posture if the sandbox becomes unavailable at runtime.

tools:
  mcp:
    - url: http://127.0.0.1:9000/tools # FAIL (TA02): private target, no SSRF validation declared
      validates_private: false
  exec:
    - name: shell-exec
      env_policy:
        deny_direct_env_dump: true
        deny_indirect_env_read: false # FAIL (TA04): direct denied, indirect not covered
      approvals:
        - basename: python3
          path_scoped: false # FAIL (TA05): allow-always keyed on basename only

schedules:
  cron:
    - tenant: tenant-a
      target_agent: research-agent-tenant-b # FAIL (TA03): cron binding crosses tenant boundary
                                             # FAIL (TA06): no captures_creator_identity declared

agents:
  - name: research-agent-tenant-b
    tenant: tenant-b
    # FAIL (TA10): no overrides declared for workspace_restriction or
    # sandbox_config, so this agent silently inherits an undeclared global
    # default instead of an explicit per-agent value.

owner: # PASS (TA12): a real deployment guarantees sysadmin recovery access
  owner_ids:
    - system
  gateway_token_env: TENANTGUARD_GATEWAY_TOKEN
  has_recovery_command: true
