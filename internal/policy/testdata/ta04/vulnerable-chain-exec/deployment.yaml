# TA04 vulnerable-chain-exec fixture — reproduces goclaw#1033: allow_chain_exec
# is true, so this exec tool's credential env vars are injected into every
# command of a shell operator chain (e.g. `which gh && gh pr list`), not just
# the credentialed binary itself. The direct/indirect env-dump denylist being
# fully set does not mitigate this — it's a distinct leakage path.
tools:
  exec:
    - name: shell-exec
      env_policy:
        deny_direct_env_dump: true
        deny_indirect_env_read: true
        allow_chain_exec: true
