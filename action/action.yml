name: "TenantGuard Scan"
description: >-
  Scan a self-hosted multi-tenant AI-agent deployment's configuration for
  tenant-isolation defects (TA01-TA05, TA10) and upload the results as a SARIF
  code-scanning report.
branding:
  icon: "shield"
  color: "blue"

inputs:
  target:
    description: "Path to the deployment config directory to scan"
    required: true
  control:
    description: "Compliance framework to cite (hipaa)"
    required: false
    default: "hipaa"
  upload-sarif:
    description: "Upload the SARIF report via github/codeql-action/upload-sarif"
    required: false
    default: "true"
  fail-on:
    description: "Fail the workflow step if findings are present (true/false)"
    required: false
    default: "true"
  version:
    description: >-
      tenantguard version to install (a git tag or commit SHA, e.g.
      "v0.1.0"). Required — always pin explicitly for reproducible, secure
      builds; there is no safe default because this repo has no tagged
      releases yet.
    required: true

runs:
  using: "composite"
  steps:
    - name: Set up Go
      uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
      with:
        go-version: "1.26"

    # Inputs are passed via env: rather than interpolated into the script with ${{ }} --
    # GitHub substitutes ${{ }} expressions into the script text before the shell ever
    # runs it, so any input value containing shell metacharacters would otherwise
    # execute verbatim on the runner.
    - name: Install tenantguard
      shell: bash
      env:
        INPUT_VERSION: ${{ inputs.version }}
      run: go install "github.com/RudrenduPaul/TenantGuard/cmd/tenantguard@$INPUT_VERSION"

    - name: Run scan
      id: scan
      shell: bash
      env:
        INPUT_TARGET: ${{ inputs.target }}
        INPUT_CONTROL: ${{ inputs.control }}
      run: |
        set +e
        tenantguard scan --target "$INPUT_TARGET" --control "$INPUT_CONTROL" \
          --format sarif --sarif-out tenantguard-report.sarif
        code=$?
        set -e
        echo "exit_code=$code" >> "$GITHUB_OUTPUT"
        if [ "$code" -ne 0 ] && [ "$code" -ne 1 ]; then
          echo "tenantguard scan failed to run (exit $code) — see the log above for the specific error."
          exit "$code"
        fi

    - name: Upload SARIF
      if: ${{ inputs.upload-sarif == 'true' }}
      uses: github/codeql-action/upload-sarif@02c5e83432fe5497fd85b873b6c9f16a8578e1d9 # v3
      with:
        sarif_file: tenantguard-report.sarif

    - name: Fail on findings
      if: ${{ inputs.fail-on == 'true' && steps.scan.outputs.exit_code == '1' }}
      shell: bash
      run: |
        echo "TenantGuard found tenant-isolation findings — see the uploaded SARIF report."
        exit 1
